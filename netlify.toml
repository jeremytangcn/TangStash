[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Site-wide password gate — runs on every request before it reaches
# static files or functions. See netlify/edge-functions/password-gate.js
[[edge_functions]]
  function = "password-gate"
  path = "/*"

[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200
